source: >-
  GitHub releases (github.com/iovation), registry.npmjs.org, api.nuget.org,
  packagist.org, pypi.org — probed 2026-08-13
note: >-
  TransUnion publishes no client library for its credit / TruValidate decisioning
  REST APIs (those are delivered under contract through techservices.transunion.com
  and the gated developer portal). The first-party libraries that ARE public are
  the TruValidate Device Risk mobile SDKs, shipped from the github.com/iovation org
  — iovation was acquired by TransUnion in 2018 and its device products were
  rebranded TruValidate, which the SDK READMEs state explicitly ("We have united
  these solutions under the TransUnion TruValidate brand"). The Trustev clients are
  the same acquisition pattern one generation earlier (TransUnion acquired Trustev
  in 2017) and are now dormant.
