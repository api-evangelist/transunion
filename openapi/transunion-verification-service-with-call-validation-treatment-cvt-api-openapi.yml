components:
  schemas:
    VerifyIdentity:
      required:
      - from
      - to
      - identity
      type: object
      properties:
        from:
          type: string
          example: Alice <sip:alice@example.com>
          description: \"From\" header value from SIP INVITE message
        to:
          type: string
          example: Bob <sip:5715550000@example.com>
          description: \"To\" header value from SIP INVITE message
        identity:
          type: array
          example: Bob <sip:5715550000@example.com>
          description: A list of SIP Identity values to be verified
        diversion:
          type: array
          description: A list of 'Diversion' header values from SIP INVITE message. If specified, must be one as specified in RFC5806 Section 4
        resource_priority:
          type: array
          description: A list of 'Resource-Priority' header values from SIP INVITE message. If specified, must be one as specified in RFC4412 Section 3.1
        verstat:
          type: boolean
          description: Flag for returning verstat value after SIP Identity values are verified. If specified, must be true or false
          example: X-REQUEST-ID-12345
        identity_info:
          type: boolean
          description: Flag for returning information related to SIP Identity values verified. If specified, must be true or false
        request_id:
          type: string
          description: Client supplied request identifier for tracking purpose. If not null, it will be returned back in the response object
          example: X-REQUEST-ID-12345
        status:
          type: string
          example: Bob <sip:7035550000@example.com>;reason=away
          description: Verification status requirement. If specified, must be 'none', 'partial' or 'all'
        date:
          type: string
          description: Date header value from SIP INVITE message. If specified, must be in RFC1123 format
          example: Fri, 16 Apr 2021 02:56:51 GMT
        pai:
          type: array
          description: A list of 'P-Asserted-Identity' header values from SIP INVITE message. If specified, must be one as specified in RFC 3325 Section 9.1
        finger_print:
          type: array
          description: A list of SDP 'a=fingerprint' attribute values from SIP INVITE message. If specified, must be one as specified in RFC 3325 Section 9.1
          items:
            type: object
            properties:
              algorithm:
                type: string
                description: Algorithm name of a SDP 'a=fingerprint' attribute from SIP INVITE message. Cannot be null or empty
                example: SHA-1
              digest:
                type: string
                description: Digest value of a SDP 'a=fingerprint' attribute from SIP INVITE message. Cannot be null or empty
                example: 36:3B:AE:12:95:95:F5:97:2D:F7:E0:84:FE:CD:F1:BC:AD:7A:70:64:F7:E7:4F:7E:A6:02:06:0E:37:54:CF:F7
        orig_cc:
          type: array
          description: Default country codes for the originator telephone number. If specified, must be a valid country code
          example:
          - '1'
          - '44'
        dest_cc:
          type: string
          description: Default country code for the destination telephone number. If specified, must be a valid country code
          example: '1'
        cnam:
          type: boolean
          description: Flag for performing CNAM lookup. If specified, must be true or false
        robocall:
          type: boolean
          description: Flag for returning Robocall Call Insight data. If specified, must be true or false
        call_info:
          type: string
          description: Optional "Call-Info" header value for extracting "crn" and "jcard_uri" values
          example: <http://example.com/alice.json>;purpose=jcard;call-reason=Travel
        caller_reason:
          type: string
          description: Optional "crn" value specified by RCD PASSporT extension
          example: Travel
        alt_present_number:
          type: string
          description: Optional "apn" value specified by RCD PASSporT extension
          example: Disney <sip:+18005550000@example.com>
        caller_name:
          type: string
          description: Optional "nam" value specified by RCD PASSporT extension
          example: Alice Liddell
        jcard:
          type: string
          description: Optional JSON string for "jcd" value specified by RCD PASSporT extension
          example: '["vcard",[["version",{},"text","4.0"],["fn",{},"text","Alice Liddell"],[ "email",{},"text","alice@example.com"]]]'
        jcard_uri:
          type: string
          example: cid:123456
          description: Optional "jcl" value specified by RCD PASSporT extension
        rcd_issuer:
          type: string
          example: Disney, Inc.
          description: Optional "iss" value specified by RCD PASSporT extension
        rcd_integrity:
          type: boolean
          example: true
          description: Optional boolean flag for generating "rcdi" value. It's the flag for generating RCD PASSporT integrity hash. If specified, must be either true or false, with default as true
    VerifyResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
          description: "Its value is \"ok\" after the SIP Identity headers are validated with the required verification status. There are three possible \"status\" values specified in the request\n  * **none** - This status value indicates that the SIP Identity headers specified in the request are not required to be verified\n\n  * **partial** - This status value indicates that one or more SIP Identity headers specified in the request are required to be verified\n\n  * **all** - This status value indicates that all SIP Identity headers specified in the request are required to be verified\n\nBased on the verification status requirement specified in the request, the VS will return a \"status\" attribute in the response with the following two possible values: \n\n  * **ok** - This status value indicates that the verification result of SIP Identity headers has met the verification status requirement specified in the request\n  * **error** - This status value indicates that the verification result of SIP Identity headers has not met the verification status requirement specified in the request\n\nIf there are any errors encountered in the verification process, an \"error\" attribute in the response will list all of those errors.\n\nIf the \"robocall\" attribute is specified as \"true\" in the request, a \"call_insight\" attribute will be returned, if any.\n"
        request_id:
          type: string
          example: X-REQUEST-ID-12345
          description: Client supplied request identifier for tracking purpose
        verstat:
          type: string
          example: TN-Validation-Passed
          description: '''verstat'' value defined by ETSI TS 124 299'
        identity_info:
          description: A list of information related to SIP Identity headers verified
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                example: Ok
                description: The verification status of a SIP Identity header
              params:
                type: string
                example: info=<http://ca.example.com/test.der>;alg=ES256;ppt="shaken"
                description: The parameters in a SIP Identity header
              header:
                properties:
                  alg:
                    type: string
                    example: ES256
                  ppt:
                    type: string
                    example: shaken
                  typ:
                    type: string
                    example: passport
                  x5u:
                    type: string
                    example: http://ca.example.com/test.der
                type: object
                description: The decoded PASSporT header object in a SIP Identity header
              claim:
                description: The decoded PASSporT claim object in a SIP Identity header
                properties:
                  attest:
                    type: string
                    example: A
                  dest:
                    required:
                    - tn
                    properties:
                      tn:
                        type: array
                        items:
                          type: string
                        example:
                        - '15715550001'
                    type: object
                  iat:
                    type: number
                    example: 1618541811
                  mky:
                    type: array
                    items:
                      type: object
                      properties:
                        alg:
                          type: string
                          example: SHA-1
                        dig:
                          type: string
                          example: 4AADB9B13F82183B540212DF3E5D496B19E57CAB
                  orig:
                    properties:
                      tn:
                        type: string
                        example: '17035550001'
                    type: object
                  origid:
                    type: string
                    example: 123456-ABCD-999999
                type: object
              certificate_info:
                description: The basic information of the certificate used in a SIP Identity header
                properties:
                  subject:
                    type: string
                    example: C=US, ST=VA, L=Somewhere, O="AcmeTelecom, Inc.", OU=VOIP, CN=TEST-EC-256-EXT-TN-JWT
                    description: The subject of the certificate used in a SIP Identity header
                  issuer:
                    type: string
                    example: C=US, O=Organization IOT Lab, CN=CallAuthnCA
                    description: The issuer of the certificate used in a SIP Identity header
                  tn_auth_list:
                    type: array
                    description: The TN Authorization List of the certificate used in a SIP Identity header
                    items:
                      type: object
                      properties:
                        spc:
                          type: string
                          example: X001
                          description: A Service Provider Code in TN Authorization List
                type: object
        cnam:
          type: string
          example: Alice In Wonderland
          description: CNAM data
        call_insight:
          description: Call insight details
          properties:
            call_treatment:
              type: string
              example: allow
              description: Call treatment method, such as 'allow', 'deny', 'send_to_vm' or 'none'
            fraud_score:
              type: number
              example: 0
              description: Numeric fraud score between 0 and 100
            original_calling_name:
              type: string
              example: Alice
              description: Original calling name value
          type: object
    VerifyErrorResponse:
      required:
      - error
      - error_id
      - http_status_code
      - sip_code
      - reason
      - timestamp
      type: object
      properties:
        status:
          type: string
          example: error
          description: Verification status
        error:
          type: array
          description: Array of errors
          items:
            required:
            - error_id
            - http_status_code
            - sip_code
            - reason
            - timestamp
            type: object
            properties:
              error_id:
                type: string
                description: The unique error identifier
              http_status_code:
                type: integer
                description: The HTTP response status code
              sip_code:
                type: integer
                description: The SIP response code associated with the error
              reason:
                type: string
                description: The detailed error text
              timestamp:
                type: string
                description: The timestamp when the error is generated
              attributes:
                type: object
                properties:
                  key:
                    type: string
                    description: any key value pair
