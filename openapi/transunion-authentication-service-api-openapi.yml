components:
  schemas:
    ErrorResponse400:
      required:
      - error_id
      - http_status_code
      - sip_code
      - reason
      - timestamp
      type: object
      properties:
        error_id:
          type: string
          description: The unique error identifier
        http_status_code:
          type: integer
          description: The HTTP response status code
        sip_code:
          type: string
          description: The SIP response code associated with the error
        timestamp:
          type: string
          description: The timestamp when the error is generated
        reason:
          type: string
          description: The detailed error text
        developer_message:
          type: string
          description: The additional developer message, if any
        attributes:
          type: object
          description: The name/value pair attribute map associated with the error
          properties:
            key:
              type: string
              description: The attribute name of 'uri' in the name/value pair
    ErrorResponse500:
      required:
      - error_id
      - http_status_code
      - sip_code
      - reason
      - timestamp
      type: object
      properties:
        error_id:
          type: string
          description: The unique error identifier
        http_status_code:
          type: integer
          description: The HTTP response status code
        sip_code:
          type: string
          description: The SIP response code associated with the error
        timestamp:
          type: string
          description: The timestamp when the error is generated
        reason:
          type: string
          description: The detailed error text
        developer_message:
          type: string
          description: The additional developer message, if any
        attributes:
          type: object
          description: The name/value pair attribute map associated with the error
          properties:
            key:
              type: string
              description: The attribute name of 'uri' in the name/value pair
    Identity:
      required:
      - from
      - to
      type: object
      properties:
        from:
          type: string
          example: Alice <sip:alice@example.com>
          description: \"From\" header value from SIP INVITE message
        to:
          type: string
          example: Bob <sip:5715550000@example.com>
          description: \"To\" header value from SIP INVITE message
        date:
          type: string
          example: Fri, 11 Aug 2017 04:17:14 GMT
          description: SIP Date header
        compact:
          type: boolean
          description: Flag for generating compact SIP Identity header, ignored for 'shaken' PASSporT type. If specified, must be true or false
        passport_type:
          type: string
          example: div
          description: PASSporT type value. If specified, must be 'shaken', 'div', 'rph' or 'rcd'
        diversion:
          type: string
          example: Bob <sip:7035550000@example.com>;reason=away
          description: First 'Diversion' header value from SIP INVITE message. If ppt=div, diversion attribute is REQUIRED.
        resource_priority:
          type: array
          description: List of 'Resource-Priority' header values from SIP INVITE message. If ppt=rph, resource_priority attribute is REQUIRED.
          items:
            type: string
            example:
            - ets.0, wps.1
            - q735.1
        call_info:
          type: string
          description: Optional "Call-Info" header value for extracting "crn" and "jcard_uri" values
          example: <http://example.com/alice.json>;purpose=jcard;call-reason=Travel
        caller_reason:
          type: string
          description: Optional "crn" value specified by RCD PASSporT extension
          example: Travel
        alt_present_number:
          type: string
          description: Optional "apn" value specified by RCD PASSporT extension
          example: Disney <sip:+18005550000@example.com>
        caller_name:
          type: string
          description: Optional "nam" value specified by RCD PASSporT extension
          example: Alice Liddell
        jcard:
          type: string
          description: Optional JSON string for "jcd" value specified by RCD PASSporT extension
          example: '["vcard",[["version",{},"text","4.0"],["fn",{},"text","Alice Liddell"],[ "email",{},"text","alice@example.com"]]]'
        jcard_uri:
          type: string
          example: cid:123456
          description: Optional "jcl" value specified by RCD PASSporT extension
        rcd_issuer:
          type: string
          example: Disney, Inc.
          description: Optional "iss" value specified by RCD PASSporT extension
        rcd_integrity:
          type: boolean
          example: true
          description: Optional boolean flag for generating "rcdi" value. It's the flag for generating RCD PASSporT integrity hash. If specified, must be either true or false, with default as true
        rcd_hash_algorithm:
          type: string
          example: sha384
          description: The algorithm for generating RCD PASSporT integrity hash. If specified, must be one of 'sha256', 'sha384' or 'sha512', with default as 'sha256'
        rcd_signature:
          type: string
          example: sha512-oODCNbWggTlXfGx1wMpFhdA6Kt2vLjNsRnwks+ffezUUTubjGLSUhqLkSjsE3SZKPWG+gywfYmKjcPtz6uMyog==
          description: Optional "rcdi" value specified by RCD PASSporT extension. It's the pre-calculated signature of RCD PASSporT integrity hash. If specified, must be not empty or blank and must be a base64 string prefixed with the hash algorithm name
        pai:
          type: array
          description: List of 'P-Asserted-Identity' header values from SIP INVITE message. If specified, must be one as specified in RFC3325 Section 9.1
          items:
            type: string
            example:
            - Alice <tel:+17035550001>
            - Alice <sip:+17035550001@example.com>
        finger_print:
          type: array
          description: List of SDP 'a=fingerprint' attribute values from SIP INVITE message. If specified, must be one as specified in RFC3325 Section 9.1
          items:
            type: object
            properties:
              algorithm:
                type: string
                description: Algorithm name of a SDP 'a=fingerprint' attribute from SIP INVITE message. Cannot be null or empty
              digest:
                type: string
                description: Digest value of a SDP 'a=fingerprint' attribute from SIP INVITE message. Cannot be null or empty
          example:
          - algorithm: SHA-1
            digest: 4A:AD:B9:B1:3F:82:18:3B:54:02:12:DF:3E:5D:49:6B:19:E5:7C:AB
          - algorithm: SHA-256
            digest: 36:3B:AE:12:95:95:F5:97:2D:F7:E0:84:FE:CD:F1:BC:AD:7A:70:64:F7:E7:4F:7E:A6:02:06:0E:37:54:CF:F7
        orig_cc:
          type: string
          description: Default country code for the origination telephone number. If specified, must be a valid country code
          example: '1'
        dest_cc:
          type: string
          description: Default country code for the destination telephone number. If specified, must be a valid country code
          example: '1'
        attest:
          type: string
          description: attest value defined by ATIS SHAKEN extension. If specified, must not be empty or blank.
          example: A
        origid:
          type: string
          description: Client supplied request identifier for tracking purpose. If not null, it will be returned back in the response object
          example: 3F9C2836-7E40-11E7-BA58-7831C1B8DEBA
        request_id:
          type: string
          description: Client supplied request identifier for tracking purpose. If not null, it will be returned back in the response object
          example: X-REQUEST-ID-12345
        priority:
          type: string
          description: The SIP 'Priority' header value from SIP INVITE message. If specified, must be psap-callback
          example: psap-callback
