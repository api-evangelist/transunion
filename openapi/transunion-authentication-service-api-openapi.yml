openapi: 3.2.0
info:
  x-logo:
    url: https://raw.githubusercontent.com/neustar/tcs-apis/main/docs/newNeustarLogo.jpeg
    altText: STIR/SHAKEN Authentication & Verification Service APIs
  version: 1.0.0
  title: STIR/SHAKEN Authentication & Verification Service Authentication Service API
  summary: null
  description: "# Overview\n  Secure Telephone Identity Revisited (STIR) and the Signature-based Handling of Asserted information using toKENs (SHAKEN) framework have already become regulatory mandates in both the United States and Canada for caller identity authentication.  These IETF and ATIS standards define how to securely compute, transit and verify SIP Identity headers through an Authentication Service (AS) and Verification Service (VS).\n\n  Since their initial implementation, STIR and SHAKEN standards have been (and continue to be) extended in multiple ways.  Additionally, the AS and VS can support supplemental features including, but not limited to telephone number ownership validation, subscriber-based policy management and robocall analytics.\n  \n  The AS and VS implement call authentication and related functions ideally through flexible, extensible, robust and standardized Application Program Interfaces (APIs).  Many initial implementations of the SHAKEN framework employ RESTful API clients, but these are constrained to only supporting base functionality.  The STIR/SHAKEN API project promotes collaboration to expand functionality, while hopefully also achieving industry alignment amongst various RESTful API implementations and/or applicable standards, where possible.\n\n  There are generally two ways to authenticate a RESTful API client - 'apiKey' or 'coming from a whitelisted client IP'.  Both are initially supported in the STIR/SHAKEN API project.  If a RESTful API client chooses to use 'apiKey' for authentication, an 'apiKey' query parameter, with a pre-provisioned value, is validated to access API calls that are restricted. If the 'apiKey' parameter is not specified, a pre-provisioned client IP address may be used as the backup authentication mechanism.  The server first checks for availability of an 'apiKey' in the query parameter and if it doesn't find one, it tries to authenticate via the client IP address.\n\n  The primary objective of the STIR/SHAKEN API project is to foster broad and open industry collaboration amongst developers and implementers of (or those desiring to implement) RESTful APIs for timely and extensible support of evolving caller identity authentication standards, including supplemental feature support as required.  The core set of ATIS SHAKEN standards supported in this project, including their underlying and/or referenced IETF and 3GPP standards, are:\n  * ATIS-1000074, “SHAKEN”\n  * ATIS-1000078, “National Security / Emergency Preparedness Priority Service SIP RPH Signing and Verification using PASSporTs”\n  * ATIS-1000080, “SHAKEN: Governance Model and Certificate Management”\n  * ATIS-1000084, “Operational and Management Considerations for SHAKEN STI Certification Authorities and Policy Administrators”\n  * ATIS-1000085, “SHAKEN: SHAKEN Support of “div” PASSporT”\n  * ATIS-1000092, “SHAKEN: Delegate Certificates\n  * ATIS-1000093, “Toll-Free Numbers in the SHAKEN Framework”\n  * ATIS-1000094, “SHAKEN: Calling Name and Rich Call Data Handling Procedures”\n  * ATIS-1000098, “SIP Resource-Priority Header and Priority Header Signing in Support of Emergency Calling”\n\nLooking forward to your support, feedback and contributions.\n"
servers:
- url: https://{hostname}:{port}/{optionalRoutingPath}
  description: https
tags:
- name: Authentication Service
  description: "This API endpoint uses the following data elements ('required' elements identified) in the REQUEST to create a SIP Identity header. Based on the HTTP header of 'Content-Type' (e.g. json, text/plain), the request body (data) can include various data elements. Please refer to the examples for more details.\n\nThree different API entry points are defined for SIP Identity header creation:\n  * Accepts requests in JSON format and produces responses in JSON format\n  * Accepts text messages in text/plain and produces responses in JSON format\n  * Accepts text messages in text/plain and produces responses in text/plain format\n"
paths:
  /authn/v2/identityj-j:
    post:
      tags:
      - Authentication Service
      description: 'This API entry point accepts requests and produces responses in JSON Format.

        '
      summary: Request & Response in JSON Format
      operationId: authn/identityj-j
      parameters:
      - name: apiKey
        in: query
        schema:
          type: string
        description: Required, if client chooses to authenticate via apiKey. Not required, if client chooses to authenticate via pre-provisioned client IP
      - name: ppt
        in: query
        description: Only applicable when SIP INVITE message is included in the request body. PASSporT type value. If specified, must be 'shaken', 'div', 'rcd' or 'rph'. If not specified, default ppt=shaken by authentication server
        required: false
        style: form
        schema:
          type: string
      - name: attest
        in: query
        required: false
        description: Only applicable when SIP INVITE message is included in the request body. Attestation indicator claim value.'attest' value specified by ATIS-1000074.v002. If specified, must be a either "A", "B" or "C". If not specified, default attest=A by authentication server
        schema:
          type: string
      - name: origid
        in: query
        description: Only applicable when SIP INVITE message is included in the request body. Origination identifier claim value. 'origid' value specified by ATIS-1000074.v002. If specified, should be a unique string corresponding to a UUID (RFC 4122). If not specified, authentication server would add a UUID.
        required: false
        style: form
        schema:
          type: string
      - name: compact
        in: query
        description: Only applicable when SIP INVITE message is included in the request body. Flag for compact SIP Identity header, ignored for 'shaken' PASSporT type. If specified, must be true or false
        required: false
        style: form
        schema:
          type: boolean
      - name: origcc
        in: query
        description: Only applicable when SIP INVITE message is included in the request body. Default country code for the originator telephone number. If specified, must be a valid country code
        required: false
        style: form
        schema:
          type: string
      - name: destcc
        in: query
        description: Only applicable when SIP INVITE message is included in the request body. Default country code for the destination telephone number. If specified, must be a valid country code
        required: false
        style: form
        schema:
          type: string
      - name: verstat
        in: query
        description: Only applicable when SIP INVITE message is included in the request body. Verstat value as defined in ETSI TS 124 299, for performing tagging and the SIP Identity header optionally removed
        required: false
        style: form
        schema:
          type: string
      - name: identity
        in: query
        description: Only applicable when SIP INVITE message is included in the request body. Flag for including SIP Identity header when the "verstat" parameter is specified, with the default value as "true". If specified, must be true or false
        required: false
        style: form
        schema:
          type: boolean
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Identity'
          text/plain:
            examples:
              request:
                value: 'INVITE sip:7035550021@proxy.example.com;transport=UDP SIP/2.0

                  v: SIP/2.0/UDP proxy.example.com:39089;branch=z9hG4bK

                  Max-Forwards: 70

                  m: "Alice" <sip:5715550001@proxy.example.com:39089;transport=UDP>

                  t: "Bob" <sip:+17035550002@example.com>

                  f: "Alice" <sip:+15715550001@example.com>;tag=1f4e4f40

                  i: YzRlZDFlYzYyM2IwOTdlMzk0MDA3MTRmZmY3OGIzODM.

                  P-Asserted-Identity: Alice <sip:+15715550001@example.com>

                  CSeq: 2 INVITE

                  Allow: INVITE, ACK, CANCEL, BYE, NOTIFY, REFER, MESSAGE, OPTIONS, INFO, SUBSCRIBE

                  c: application/sdp

                  Date: Fri, 14 May 2021 16:57:04 GMT

                  k: replaces, norefersub, extended-refer, timer, X-cisco-serviceuri

                  User-Agent: Z 3.3.25608 r25552

                  Allow-Events: presence, kpml

                  l: 425


                  v=0

                  o=Z 0 0 IN IP4 10.31.32.251

                  s=Z

                  c=IN IP4 10.31.32.251

                  t=0 0

                  m=audio 8000 RTP/AVP 8 0 3 110 98 101

                  a=fingerprint:md5 14:75:8F:1A:FD:44:C0:9B:79:92:07:3C:CF:00:B4:3D

                  a=fingerprint:sha-256 AE:C0:70:64:5F:E5:3E:E3:B3:76:30:59:37:61:34:F0:58:CC:33:72:47:C9:78:AD:D1:78:B6:CC:DF:B0:01:9F

                  a=rtpmap:110 speex/8000

                  a=rtpmap:98 iLBC/8000

                  a=fmtp:98 mode=20

                  a=rtpmap:101 telephone-event/8000

                  a=fmtp:101 0-15

                  a=sendrecv

                  '
      x-summary: null
      x-code-samples:
