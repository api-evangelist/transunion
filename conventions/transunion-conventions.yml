    not agree, which is worth knowing before pinning to either.
  companion_spec_version: '1.0, TS 24.229, Release 17.10.0'
error_envelope:
  format: vendor-json
  shape: '{error_id, http_status_code, sip_code, timestamp, reason, developer_message?, attributes?}'
  verification_variant: '{status: "error", error: [ ... ]} — an ARRAY of the above'
  rfc9457: false
  detail: see errors/transunion-problem-types.yml (179 error_ids)
declared_status_codes:
  detail: >-
    Responses are declared as the wildcards 200 / 4xx / 5xx only. A generated client sees
    three outcomes; the real service returns at least 400, 403, 406, 415, 500 and 503,
    visible only inside the response examples. This is the single biggest contract-quality
    gap in the spec.
rate_limiting:
  documented: false
  headers: []
  detail: >-
    No X-RateLimit-*/RateLimit-* headers, no 429 response, and no limits in the prose —
    see rate-limits/transunion-rate-limits.yml.
request_tracing:
  request_id_header: null
  detail: >-
    No correlation/request-id header is documented. The error object's timestamp field is
    the only trace anchor the contract offers.
deployment_model:
  servers: 'https://{hostname}:{port}/{optionalRoutingPath}'
  detail: >-
    The server block is fully templated because TCS AS/VS is deployed per carrier — the
    hostname is the operator's own STI-AS/STI-VS instance, not a TransUnion multi-tenant
    endpoint. This is why no fixed baseURL exists for the API and why the spec, not a
    hosted host, is the artifact.
