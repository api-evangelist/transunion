note: >-
  Cross-cutting semantics for the one TransUnion API surface with a public
  machine-readable contract: TruContact Trusted Call Solutions (STI-AS / STI-VS).
  Every line below is read from the spec. NO Idempotency pointer is emitted in
  apis.yml because the provider documents no idempotency contract — see
  idempotency.supported: false.
authentication:
  style: api-key-in-query, with client-IP allowlist as fallback
  parameter: apiKey
  location: query
  declared_as_security_scheme: false
  detail: see authentication/transunion-authentication.yml
content_negotiation:
  note: >-
    This API's most distinctive convention: the request and response media types are
    encoded in the OPERATION NAME rather than negotiated by header. The suffix reads
    <request-format>-<response-format>.
  operations:
    - {operation: authn/identityj-j, request: application/json, response: application/json}
    - {operation: authn/identitys-j, request: text/plain, response: application/json}
    - {operation: authn/identitys-s, request: text/plain, response: text/plain}
    - {operation: authn/identitymps, request: multipart (text/JSON), response: text/plain}
    - {operation: authn/identitympj, request: multipart (text/JSON), response: application/json}
    - {operation: verify/identityj-j, request: application/json, response: application/json}
    - {operation: verify/identitys-j, request: text/plain, response: application/json}
    - {operation: verify/identitys-s, request: text/plain, response: text/plain}
    - {operation: verify/identitycvt, request: application/json, response: application/json}
idempotency:
  supported: false
  header: null
  detail: >-
    No Idempotency-Key parameter, header or retry contract appears anywhere in either
    published spec. The operations are semantically pure-ish (signing a PASSporT for the
    same call twice produces another signed token rather than a duplicate side effect),
    but the provider makes no idempotency promise, so none is recorded.
pagination:
  supported: false
  detail: nine single-shot POST operations; there are no collection endpoints.
