- aid: transunion:truvalidate-device-risk
  name: TransUnion TruValidate Device Risk
  description: >-
    Device recognition and fraud signals, formerly iovation FraudForce. Mobile SDKs collect a device "blackbox"
    that is submitted to a risk check from your servers. The API host api.iovation.com is behind mutual
    TLS — it answers "Unauthorized - missing/invalid client certificate" to any anonymous request — and
    no OpenAPI is published.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/iovation
  baseURL: https://api.iovation.com
  x-ownership-note: >-
    iovation was acquired by TransUnion in 2018 and its device products were rebranded TruValidate; the
    SDK READMEs state it directly — "We have united these solutions under the TransUnion TruValidate brand."
  tags:
  - Fraud Prevention
  - Device Intelligence
  - Identity
  - Authentication
  properties:
  - type: SourceCode
    url: https://github.com/iovation/deviceprint-SDK-iOS
  - type: SourceCode
    url: https://github.com/iovation/deviceprint-SDK-Android
- aid: transunion:transunion-authentication-service-api
  name: TransUnion Authentication Service API
  description: >-
    This API endpoint uses the following data elements ('required' elements identified) in the REQUEST
    to create a SIP Identity header. Based on the HTTP header of 'Content-Type' (e.g. json, text/plain),
    the request body (data) can include various data elements. Please refer to the examples for more details.


    Three different API entry points are defined for SIP Identity header creation:
      * Accepts requests in JSON format and produces responses in JSON format
      * Accepts text messages in text/plain and produces responses in JSON format
      * Accepts text messages in text/plain and produces responses in text/plain format
