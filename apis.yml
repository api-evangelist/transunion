apis:
- aid: transunion:global-developer-portal
  name: TransUnion Global Developer Portal
  description: >-
    TransUnion's API products for credit reporting, identity verification, fraud prevention and consumer
    risk decisioning. Access requires a business agreement with TransUnion and credentials issued by an
    account manager; no machine-readable contract is published. The historical portal host developer.transunion.com
    no longer resolves (NXDOMAIN, checked 2026-08-13), so the live technical surface is Client Technical
    Services.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://techservices.transunion.com/
  x-base-url-note: >-
    No baseURL recorded. developer.transunion.com — carried here since 2026-05 — is NXDOMAIN as of 2026-08-13,
    and no public TransUnion document states a production API host for these products. Recorded as missing
    rather than guessed from the domain.
  tags:
