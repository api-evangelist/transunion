weaknesses:
  - id: apikey-in-query
    detail: >-
      The API key travels as a URL query parameter, so it lands in proxy logs, browser
      history and Referer headers. A header-borne key would be the RFC-friendly form.
  - id: no-securityschemes
    detail: >-
      components.securitySchemes is absent and no operation carries a security[]
      requirement, so automated clients, gateways and scanners see nine unauthenticated
      POST endpoints. The auth model exists only in prose.
